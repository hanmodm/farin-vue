server:
  port: 8780
  servlet:
    context-path: /
    jsp:
      init-parameters:
        development: true
        mappedfile: false
    session:
      timeout: 14400  # 4hr 
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  tomcat:
    max-http-form-post-size: -1 # the maximum size of the whole post request
    max-swallow-size: -1        # the maximum size of a request body
    ajp:
      protocol: AJP/1.3
      port: 8709
      enabled: true
mybatis:
  config-location: classpath:configs/mybatis-config.xml
  mapper-locations: classpath*:mybatis/**/*.xml 
  
