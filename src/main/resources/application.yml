  groovy: 
    template: 
      cache: false
  mustache:
    cache: false
  datasource-oracle:
    driver-class-name: oracle.jdbc.OracleDriver
    jdbc-url: jdbc:oracle:thin:@//10.64.2.114:1531/RNDPLMDEV
    username: plm
    password: spam!8
    connection-timeout: 20000
    maximum-pool-size: 75
    connection-test-query: SELECT 1 FROM DUAL
    minimum-idle: 10
    pool-name: pool-farin-vue
  transaction:
    default-timeout: 10
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration
